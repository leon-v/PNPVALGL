name: PNPVALG

services:
  php:
    build:
      context: .
      dockerfile: docker/php-fpm/Dockerfile
    hostname: php
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./app:/var/www
      - ./docker/php-fpm/infra:/usr/local/lib/php/infra:ro
      - ./docker/php-fpm/config/zz-logging.conf:/usr/local/etc/php-fpm.d/zz-logging.conf:ro
      - ./docker/php-fpm/config/zz-opcache.ini:/usr/local/etc/php/conf.d/zz-opcache.ini:ro
      - ./docker/php-fpm/config/zz-error-logging.ini:/usr/local/etc/php/conf.d/zz-error-logging.ini:ro
      - ./docker/php-fpm/config/zz-xdebug.ini:/usr/local/etc/php/conf.d/zz-xdebug.ini:ro
      - ./docker/php-fpm/logs:/var/log/php-fpm
      - ./docker/nginx/logs:/var/log/nginx:rw
      - ./docker/php-fpm/entrypoint.sh:/usr/local/bin/php-entrypoint.sh:ro
      - ./docker/generated:/run/container.env
    entrypoint: /usr/local/bin/php-entrypoint.sh
    command: php-fpm
    env_file:
      - path: docker/.env.template
        required: true
      - path: docker/.env
        required: false
      - path: docker/.env.local
        required: false
      - path: docker/generated/.env.key
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x php-fpm > /dev/null"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - backend

  nginx:
    image: nginx
    hostname: nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/logs:/var/log/nginx
    env_file:
      - path: docker/.env.template
        required: true
      - path: docker/.env
        required: false
      - path: docker/.env.local
        required: false
      - path: docker/generated/.env.key
        required: false
    depends_on:
      php:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - backend

  postgres:
    image: postgres:18
    hostname: postgres
    restart: unless-stopped
    env_file:
      - path: docker/.env.template
        required: true
      - path: docker/.env
        required: false
      - path: docker/.env.local
        required: false
      - path: docker/generated/.env.key
        required: false
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/logs:/var/log/postgres
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./docker/postgres/conf/postgres-logging.conf:/etc/postgresql/postgres-logging.conf:ro
      # TODO: This should be in a config file
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c logging_collector=on
      -c log_destination=jsonlog
      -c log_directory=/var/log/postgres
      -c "log_filename=postgresql-%Y-%m-%d_%H%M%S.log"
      -c log_rotation_age=60
      -c log_rotation_size=10240
      -c log_statement=ddl
      -c log_min_duration_statement=1000
      -c log_connections=on
      -c log_disconnections=on
      -c log_lock_waits=on
      -c log_temp_files=0
      -c log_checkpoints=on
      -c log_autovacuum_min_duration=1000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\""]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  valkey:
    image: valkey/valkey:9-trixie
    hostname: valkey
    restart: unless-stopped
    env_file:
      - path: docker/.env.template
        required: true
      - path: docker/.env
        required: false
      - path: docker/.env.local
        required: false
      - path: docker/generated/.env.key
        required: false
    volumes:
      - valkeydata:/data
      - ./docker/valkey/valkey.conf:/usr/local/etc/valkey/valkey.conf:ro
    command: valkey-server /usr/local/etc/valkey/valkey.conf
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - backend

  alloy:
    image: grafana/alloy:latest
    hostname: alloy
    restart: unless-stopped
    volumes:
      - alloy_data:/var/lib/alloy
      - ./docker/alloy:/etc/alloy:ro
      - ./docker/nginx/logs:/var/log/nginx:ro
      - ./docker/php-fpm/logs:/var/log/php-fpm:ro
      - ./docker/postgres/logs:/var/log/postgres:ro
    command:
      - run
      - --storage.path=/var/lib/alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/
    networks:
      - backend

  loki:
    image: grafana/loki:3.7.0
    hostname: loki
    restart: unless-stopped
    volumes:
      - ./docker/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - backend

  grafana:
    image: grafana/grafana:latest
    hostname: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    networks:
      - backend


volumes:
  pgdata:
  valkeydata:
  loki_data:
  alloy_data:
  grafana_data:

networks:
  backend:
    driver: bridge

; PHP error logging — LokiLogger.php (auto_prepend_file) is the sole
; forwarder. It formats errors/exceptions as JSON and calls syslog()
; directly. PHP's built-in log_errors is off to prevent duplicate
; entries (especially for fatal errors which can't be suppressed
; by set_error_handler).
log_errors = Off
error_reporting = E_ALL
display_errors = Off
display_startup_errors = Off
auto_prepend_file = /usr/local/lib/php/infra/LokiLogger.php

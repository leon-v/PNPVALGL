-- Postgres logging config snippet — appended to postgresql.conf
-- via the official Docker image's init mechanism.
-- Enables structured JSON log output to a shared volume that
-- Alloy tails with loki.source.file.
--
-- NOTE: This file is for documentation. The actual GUC parameters
-- are set via -c flags in compose.yaml because include_if_exists
-- is not a GUC and cannot be used with -c on the command line.

-- Enable the logging collector so jsonlog output goes to file.
logging_collector = on

-- JSON log format — each log line is a self-contained JSON object.
-- Loki ingests these natively; no regex parsing needed.
-- Files get a .json extension automatically with this destination.
log_destination = 'jsonlog'

-- Directory and file naming.  The Alloy glob /var/log/postgres/*.log
-- matches the rotation pattern.
log_directory = '/var/log/postgres'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'

-- Rotate every 60 minutes or when the file reaches 10 MB.
log_rotation_age = 60
log_rotation_size = 10240

-- What to log.
log_statement = 'ddl'                 -- CREATE, ALTER, DROP …
log_min_duration_statement = 1000     -- queries slower than 1 s
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0                    -- all temp file usage
log_checkpoints = on
log_autovacuum_min_duration = 1000    -- autovacuum runs ≥ 1 s

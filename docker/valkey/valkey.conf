# Valkey configuration — Redis-compatible, tune to your workload.

# ── Persistence ──────────────────────────────────────────────────────────────
# Snapshot every 60s if ≥1000 keys changed, every 300s if ≥10, every 900s if ≥1.
save 900 1
save 300 10
save 60 1000

# Append-only file for crash safety. everysec is the sweet spot.
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ── Memory ───────────────────────────────────────────────────────────────────
# Cap at 256 MB for dev; bump for production.
maxmemory 256mb

# Evict least-recently-used keys when maxmemory is hit.
# Use allkeys-lru for a pure cache; volaitle-lru if you also store persistent data.
maxmemory-policy allkeys-lru

# ── Networking ───────────────────────────────────────────────────────────────
bind 0.0.0.0
port 6379
protected-mode no
tcp-backlog 511
timeout 0
tcp-keepalive 300

# ── General ──────────────────────────────────────────────────────────────────
daemonize no
loglevel notice
databases 16
